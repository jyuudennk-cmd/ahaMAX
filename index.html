<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ahamo→MAXのりかえ割 提案マスター</title>
    
    <style>
        :root { 
            --ahamo-purple: #6A1B9A; 
            --max-red: #D32F2F; 
            --secondary: #F3E5F5; 
            --text: #212121; 
            --card-bg: #ffffff;
        }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--secondary); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; -webkit-user-select: none; color: var(--text); }
        
        header { 
            background: linear-gradient(135deg, var(--ahamo-purple) 0%, var(--max-red) 100%); 
            color: white; width: 100%; text-align: center; padding: 16px 0; 
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.4); 
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 2px solid #fff;
        }
        h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.05em; font-weight: bold; }
        .update-info { font-size: 0.75rem; color: #E1BEE7; margin-top: 4px; font-weight: bold; }
        
        .progress-container { width: 100%; background: #E1BEE7; height: 6px; }
        #progress-bar { background: var(--max-red); width: 0%; height: 100%; transition: 0.4s ease-out; }

        .stat-area { font-size: 0.8rem; margin-top: 15px; opacity: 0.8; color: var(--ahamo-purple); font-weight: bold; letter-spacing: 0.05em; }

        .container { width: 90%; max-width: 400px; margin-top: 25px; perspective: 1000px; }
        .card { width: 100%; height: 350px; position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; box-sizing: border-box; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); background: var(--card-bg); color: var(--text); border: 1px solid #E1BEE7; }
        
        .card-front { border-top: 6px solid var(--ahamo-purple); }
        .card-back { transform: rotateY(180deg); background: #fffcfcfc; border: 3px solid var(--max-red); }
        
        .cat-badge { position: absolute; top: 15px; left: 15px; background: linear-gradient(90deg, var(--ahamo-purple), var(--max-red)); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: white; font-weight: bold; letter-spacing: 0.05em; }
        .question { font-size: 1.2rem; font-weight: bold; line-height: 1.5; text-align: center; color: var(--text); }
        .answer { font-size: 1.1rem; line-height: 1.6; text-align: left; width: 100%; color: var(--text); }
        .answer strong { color: var(--max-red); border-bottom: 2px solid rgba(211, 47, 47, 0.2); }
        
        .tap-hint { margin-top: 25px; color: #9C27B0; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: bold;}

        .controls { margin-top: 30px; display: flex; gap: 15px; width: 90%; max-width: 400px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.96); }
        .btn-check { background: var(--ahamo-purple); color: white; }
        .btn-next { background: #E0E0E0; color: #333; }
        
        .btn-reset { margin-top: 25px; background: transparent; color: #7B1FA2; text-decoration: underline; font-size: 0.75rem; border: none; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>ahamo→MAXのりかえ割 マスター</h1>
    <div class="update-info">厳選10問・実務直結版</div>
</header>
<div class="progress-container"><div id="progress-bar"></div></div>
<div class="stat-area" id="stat-text">Ready...</div>

<div class="container">
    <div class="card" id="card" onclick="this.classList.toggle('is-flipped')">
        <div class="card-face card-front">
            <span class="cat-badge" id="cat-display">-</span>
            <div class="question" id="q-display">タップして開始</div>
            <div class="tap-hint">Tap to Flip</div>
        </div>
        <div class="card-face card-back">
            <div class="answer" id="a-display">---</div>
            <div class="tap-hint" style="color:var(--max-red)">Back</div>
        </div>
    </div>
</div>

<div class="controls">
    <button class="btn-check" onclick="markAsLearned()">覚えた</button>
    <button class="btn-next" onclick="nextCard()">次へ</button>
</div>

<button class="btn-reset" onclick="resetProgress()">進捗リセット</button>

<script>
    const allData = [
        { cat: "特典", q: "「ahamo→MAXのりかえ割」の最大の特典内容（割引額と期間）は？", a: "対象プランの月額料金から、最大12ヶ月間、毎月<strong>2,750円（税込）</strong>が割引されます。" },
        { cat: "条件", q: "対象となるahamoの「利用期間」の条件は？", a: "ahamoを<strong>「連続して1年以上（365日以上）」</strong>契約しているお客様が対象です。（※ALADINで要確認）" },
        { cat: "対象", q: "割引対象となる変更後のプランは？", a: "<strong>「ドコモ MAX」</strong> または <strong>「ドコモ ポイ活 MAX」</strong> です。" },
        { cat: "併用", q: "「みんなドコモ割」や「ドコモ光セット割」などの各種割引とは併用できる？", a: "<strong>併用可能</strong>です。各種割引をフル適用すれば、最初の1年間はahamoよりも安く大容量プランが使えます。" },
        { cat: "ターゲット", q: "最も提案しやすい「ターゲット層」は誰？", a: "ahamoで<strong>「大盛りオプション」</strong>を利用中の方や、毎月データ追加（1GB/550円）を繰り返している方です。" },
        { cat: "トーク", q: "「ahamo大盛り」を利用中のお客様へのキラーフレーズは？", a: "「1年間毎月2,750円引かれるので、<strong>今の料金のまま（または安く）</strong>、100GBの制限がなくなって完全無制限になります！」" },
        { cat: "提案", q: "「ドコモ ポイ活 MAX」を提案するメリットは？", a: "割引で月額が下がるだけでなく、決済で<strong>さらにdポイントが大量還元</strong>され、実質負担が激減する最強の組み合わせになります。" },
        { cat: "注意点", q: "割引終了後（13ヶ月目以降）の案内で、クレームを防ぐために必ず伝えるべきことは？", a: "「1年経過後は割引が終了し、<strong>通常のMAXの料金に戻る（2,750円上がる）</strong>」という事実を、必ず強調して説明します。" },
        { cat: "注意点", q: "「1年後に割引が終わったら、またahamoに戻していいの？」と聞かれたら？", a: "「はい、<strong>違約金等なしでいつでもahamoに戻せます。</strong>まずは1年間、無制限の快適さを体験してください」と案内します。" },
        { cat: "意義", q: "スタッフがこのキャンペーンを獲得する最大の意義は？", a: "期間限定の強力な割引を武器に、店舗の重要指標である<strong>「MAX（無制限プラン）の純増」</strong>を劇的に進捗させることです。" }
    ];

    const STORAGE_KEY = 'ahamoToMax_10q_v1';

    let learnedIndexes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentIndex = 0;

    function updateDisplay() {
        const remaining = allData.filter((_, i) => !learnedIndexes.includes(i));
        const progress = (learnedIndexes.length / allData.length) * 100;
        
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('stat-text').textContent = `習得済み: ${learnedIndexes.length} / 全${allData.length}問`;

        if (remaining.length === 0) {
            document.getElementById('cat-display').textContent = "MASTER";
            document.getElementById('q-display').innerHTML = "アップセルの極意を<br>完全習得しました！";
            document.getElementById('a-display').innerHTML = "2,750円引の強力なキャンペーンを武器に、<br>MAXの獲得件数を量産してください！<br>（※1年後の料金戻りの説明はお忘れなく）";
            document.getElementById('card').classList.remove('is-flipped');
            return;
        }

        while (learnedIndexes.includes(currentIndex)) {
            currentIndex = (currentIndex + 1) % allData.length;
        }

        const data = allData[currentIndex];
        document.getElementById('cat-display').textContent = data.cat;
        document.getElementById('q-display').innerHTML = data.q;
        document.getElementById('a-display').innerHTML = data.a;
        document.getElementById('card').classList.remove('is-flipped');
    }

    function markAsLearned() {
        if (!learnedIndexes.includes(currentIndex)) {
            learnedIndexes.push(currentIndex);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(learnedIndexes));
            nextCard();
        }
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % allData.length;
        updateDisplay();
    }

    function resetProgress() {
        if (confirm('進捗をリセットして最初から学習しますか？')) {
            learnedIndexes = [];
            localStorage.removeItem(STORAGE_KEY);
            currentIndex = 0;
            updateDisplay();
        }
    }

    updateDisplay();
</script>
</body>
</html>
